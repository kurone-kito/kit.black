cache:
  cacheFormat: universal
  cacheLocation: node_modules/.cache/cspell/.cspell.cache
  cacheStrategy: metadata
  useCache: true
import:
  - '@kurone-kito/cspell-config'
ignorePaths:
  - node_modules
  - storybook-static
  - /scripts
  - /schemas
  - /fixtures/schemas
version: '0.2'
words:
  - agentic
  - amebient
  - cresteaju
  - dedup
  - deprioritize
  - desync
  - desynced
  - dofork
  - dziedzic
  - esync
  - ghec
  - ghes
  - graphig
  - lukasz
  - momoneko
  - nektos
  - onnx
  - pixiv
  - pylint
  - qwen
  - remediations
  - solidjs
  - toctou
  - towa
  - udon
  - undispositioned
  - unioned
  - unpushed
  - unreplied
  - unscored
  - unstub
  - unwaivable
  - unwaived
  - vgeek
  - vinxi
  - vocaloid
  - vrchat
  - vrcui
  - waivable
