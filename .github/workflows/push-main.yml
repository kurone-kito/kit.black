name: Deploy the production to Netlify
run-name: Merged the main branch by @${{ github.actor }}
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  queue: max
permissions:
  contents: read
jobs:
  detect-changes:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    permissions:
      actions: write
      contents: read
    steps:
      - continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        name: Keep the scheduled workflow enabled
        run: gh api --include -X PUT repos/${{ github.repository }}/actions/workflows/push-main.yml/enable
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Stages the pushed branch
        uses: actions/checkout@v7
      - name: Pre-prepare the Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Enable the corepack because of the pnpm
        run: corepack enable
      - name: Post-prepare the Node.js environment
        uses: actions/setup-node@v7
        with:
          cache: ${{ !env.ACT && 'pnpm' || '' }}
          node-version-file: .node-version
      - env:
          HUSKY: 0
        name: Install the dependencies
        run: pnpm install --prefer-frozen-lockfile
      - name: Build the lib and fetcher workspaces
        run: pnpm --filter @kurone-kito/kit.black-lib --filter @kurone-kito/kit.black-fetcher run build
      - name: Ensure the local .env file exists
        run: touch .env
      - id: compare
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          ID_OTHERS: ${{ secrets.ID_OTHERS }}
          ID_RELEASE: ${{ secrets.ID_RELEASE }}
          ID_STREAMING: ${{ secrets.ID_STREAMING }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          TZ: Asia/Tokyo
        name: Compare the fresh fetch against the live data
        run: node --env-file=.env packages/fetcher/dist/binDetectChange.mjs
  deploy:
    needs: detect-changes
    if: >-
      !cancelled() && (github.event_name != 'schedule' ||
      needs.detect-changes.result != 'success' ||
      needs.detect-changes.outputs.changed == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Set git to use LF
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Stages the pushed branch
        uses: actions/checkout@v7
      - name: Pre-prepare the Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Enable the corepack because of the pnpm
        run: corepack enable
      - name: Post-prepare the Node.js environment
        uses: actions/setup-node@v7
        with:
          cache: ${{ !env.ACT && 'pnpm' || '' }}
          node-version-file: .node-version
      - env:
          HUSKY: 0
        name: Install the dependencies
        run: pnpm install --prefer-frozen-lockfile
      - env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          ID_OTHERS: ${{ secrets.ID_OTHERS }}
          ID_RELEASE: ${{ secrets.ID_RELEASE }}
          ID_STREAMING: ${{ secrets.ID_STREAMING }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          TZ: Asia/Tokyo
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        name: Run the build
        run: pnpm run build
      - env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NODE_ENV: production
        name: Deploy to Netlify
        # cspell:disable-next-line
        uses: nwtgck/actions-netlify@d22a32a27c918fe470bbc562e984f80ec48c2668 # v4.0
        with:
          enable-commit-comment: false
          enable-commit-status: false
          enable-github-deployment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          production-deploy: true
          production-branch: main
          publish-dir: ./packages/web/dist
